name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: 4.7.2
        use-dotnet: false
        include-templates: true

    - name: Test Bash script failure handling
      run: python3 tests/script_runner_test.py

    - name: Source tests
      run: |
        ./test.sh source

    - name: Build
      run: |
        ./build.sh all

    - name: Smoke Linux export
      run: |
        ./test.sh linux-export

    - name: Create Build Archives
      run: |
        mkdir -p dist
        (cd out/html && zip -r ../../dist/snake-web.zip .)
        (cd out/win64 && zip -r ../../dist/snake-windows.zip .)
        (cd out/linux64 && zip -r ../../dist/snake-linux.zip .)

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: godot-build
        path: dist/
        retention-days: 3

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: 4.7.2
        use-dotnet: false
        include-templates: true

    # setup-godot exposes an extensionless hard link on Windows. Keep the
    # native runner on an .exe path so Windows can launch and supervise it.
    - name: Select native Windows executable
      shell: powershell
      run: |
        $engine = Join-Path $env:RUNNER_TEMP 'godot-ci.exe'
        Copy-Item -LiteralPath $env:GODOT -Destination $engine
        "GODOT_BIN=$engine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Test native script failure handling
      shell: powershell
      run: .\tests\Run-ScriptTests.ps1

    - name: Test native script failure handling in PowerShell 7
      shell: pwsh
      run: .\tests\Run-ScriptTests.ps1

    - name: Source tests, Windows export and packaged startup
      shell: powershell
      run: .\test.ps1 all

    - name: Upload Windows build
      uses: actions/upload-artifact@v7
      with:
        name: godot-windows
        path: out/win64/
        retention-days: 3

  windows-package:
    needs: build
    uses: ./.github/workflows/windows-package.yml
    with:
      artifact-name: godot-build
