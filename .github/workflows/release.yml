name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: 4.7.1
        use-dotnet: false
        include-templates: true

    - name: Source tests
      run: |
        ./test.sh source

    - name: Build
      run: |
        ./build.sh all

    - name: Create Release Archives
      run: |
        mkdir -p dist
        (cd out/html && zip -r ../../dist/snake-web.zip .)
        (cd out/win64 && zip -r ../../dist/snake-windows.zip .)
        (cd out/linux64 && zip -r ../../dist/snake-linux.zip .)

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          dist/snake-web.zip
          dist/snake-windows.zip
          dist/snake-linux.zip
